name = "solution_RamanujanGap_v3"
defaultTargets = ["Solution"]

[[require]]
name = "IEANTN"
path = "../.."

# The consumer theorems ForwardRamanujan.loss_from_budget / gap_from_budget, reused unchanged.
[[require]]
name = "solution_RamanujanNumerics_v1"
path = "../RamanujanNumerics.v1"

[[lean_lib]]
name = "RamanujanGapV3"

[[lean_lib]]
name = "Solution"
roots = ["Solution"]

# Replays, not compared by Comparator: the consumer applied to the actual program provider and to
# the actual solution of its π premise. DudekPlattNumerics.v5's solution closure includes the
# CH2.v6 density certificates: a cold build is ~120 Lean jobs at up to ~10 GB each, so build it
# once before this library (see docs/program-verification/IEANTN_PV_COMPOSITION.md).
[[require]]
name = "solution_RamanujanNumerics_v3"
path = "../RamanujanNumerics.v3"

[[require]]
name = "solution_DudekPlattNumerics_v5"
path = "../DudekPlattNumerics.v5"

[[lean_lib]]
name = "RamanujanGapReplay"
