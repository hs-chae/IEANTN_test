[[lean_lib]]
name = "PairedSolution"
roots = ["PairedSolution"]

[[lean_lib]]
name = "DensityCachedSum"
roots = ["DensityCachedSum"]

[[lean_lib]]
name = "DensityNumericDefs"
roots = ["DensityNumericDefs"]

[[lean_lib]]
name = "DensityFinSum"
roots = ["DensityFinSum"]

[[lean_lib]]
name = "DensityFastFinSum"
roots = ["DensityFastFinSum"]

[[lean_lib]]
name = "DensityFastSupport"
roots = ["DensityFastSupport"]

[[lean_lib]]
name = "DensityBlockSupport"
roots = ["DensityBlockSupport"]

[[lean_lib]]
name = "DensityCertificates"
roots = ["DensityCertificates"]

[[lean_lib]]
name = "DensitySolution"
roots = ["DensitySolution"]

[[lean_lib]]
name = "BothSolutions"
roots = ["BothSolutions"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]

