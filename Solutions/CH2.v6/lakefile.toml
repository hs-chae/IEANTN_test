name = "solution_CH2_v6"
defaultTargets = ["Solution"]

[leanOptions]
autoImplicit = false

[[require]]
name = "IEANTN"
path = "../.."

[[require]]
name = "solution_CH2_v7"
path = "../CH2.v7"

[[lean_lib]]
name = "LeanCert"
leanOptions = { autoImplicit = true }
roots = ["LeanCert.Engine.FinSumDyadic", "LeanCert.Tactic.IntervalAuto.PointIneq"]
