limitations:
- Complete conditional proofs and source semantics are supplemental research evidence;
  no official Comparator receipt is claimed.
- The direct-vector kernel-only control is stronger than this moment-source cap; no
  exclusive PV advantage or best-known claim is made.
- The open QRH half-plane remains a named input; the separately pinned OpenAI formalization
  uses a different Lean version.
- Whole-ray validity does not assert pointwise superiority over every retained comparator.
