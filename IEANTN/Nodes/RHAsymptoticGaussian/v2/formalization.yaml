limitations:
- CMS general gap/population reductions remain explicit published source predicates;
  this is not an RH-only Mathlib derivation.
- No explicit numerical onset, global record, optimality, official Comparator approval,
  source-first PV or0.8 result is asserted.
- Population intervals use the source half-open endpoint convention and require positive
  width epsilon.
- Independent component review covers all11 new v2 adapter math files; a separate
  reciprocal review covers all42 numerical provider files. Each review excludes
  its author’s own implementation and whole-project completion.
