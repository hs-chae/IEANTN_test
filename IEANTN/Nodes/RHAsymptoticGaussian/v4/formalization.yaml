limitations:
- The unchanged general CMS gap/population reductions and ordinary RH remain explicit analytic inputs; the new
  numerical and actual Fourier witness is kernel-proved.
- No explicit onset, best-known claim, optimality, official Comparator approval, source-first PV or eventual 
  coefficient0.8 is asserted.
- This is an additive new search/proof result; original locked prospective outcomes and every v1-v3 source are
  preserved.
- The population conclusion preserves half-open source intervals and positive width epsilon.
