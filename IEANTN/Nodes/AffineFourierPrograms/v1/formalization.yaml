limitations:
- The norm identity is the explicit general BRFourierInput.v1 literature premise;
  actual Fourier correspondence, eligibility, normalization, leakage and maxima are
  Lean proved.
- Source-first PV trusts the pinned Lean kernel and declared compiler, runtime, OS/API
  and hardware boundary; it does not claim a verified compiler or physical hardware.
- The flat source input has origin value15*533333333333333333/(8*10^18), slightly
  below1; it is not replaced by1.
- Matched kernel-only numerical controls prove the same mathematical caps, so this
