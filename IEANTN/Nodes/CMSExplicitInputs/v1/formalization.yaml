limitations:
- These are explicit literature/source-proof-scheme inputs; no analytic source theorem is 
  claimed newly proved in Lean.
- The zero partial-summation contract is a general specialization of a worked proof passage, not
  a printed universal theorem.
- The historical prime-gap computation is a separate external input; no source-first PV of it is
  claimed.
- No fixed numerical answer, final error cap, optimality or Comparator receipt is among these 
  inputs.
