- id: original-locked-Fap-ranges
  title: Original locked Fap explicit prime-interval ranges
  authors:
  - IEANTN contributors
  type: other
  relationship: independently-proves
  note: Exact original profile/ranges, retaining the mathematical assumptions. Literal source 
