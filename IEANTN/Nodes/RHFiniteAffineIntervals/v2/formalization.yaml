    CMSZeroSummation.v1 and the source-first norm provider is FapFourierNorm.v2.
limitations:
- The other named analytic source propositions, historical finite prime-gap computation and RH 
  remain explicit imports.
- The exact generalized weighted-zero rule now has an unconditional kernel proof through 
  CMSZeroSummation.v1; it is no longer an unproved generic proof-scheme premise.
- The original Fap numerical algorithm, strict endpoints and finite ranges are unchanged. Its 
  supporting norm proof consumes the complete actual modeled C main/printf path; physical 
  compiler/stdio/OS/hardware contracts remain explicit.
- No official Comparator receipt, retroactive primary experimental success or overall causal 
  advantage for PV is asserted.
