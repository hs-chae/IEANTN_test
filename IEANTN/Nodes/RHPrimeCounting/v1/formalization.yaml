limitations:
- The GM source estimate is literature-backed, not newly formalized. Derived outputs
  are standard-axiom Lean proofs without official Comparator receipts.
- The explicit actual prime-power correction Q=riemannPrimeCounting-primeCounting
  is retained; no pure scalar-coefficient PNT pi improvement is asserted.
- Strict gain compares two certified envelopes with the same Q/li(2)/GM correction,
  not actual unknown errors.
- The stronger .076 spectral transfer and separate610b Ramanujan branch remain incomplete;
  this node completes the robust .2772 primitive transfer.
