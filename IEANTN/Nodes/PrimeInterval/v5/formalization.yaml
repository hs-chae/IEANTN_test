limitations:
- Widths1550/1550+epsilon cover2<=x<18446744073709551557, not allx<2^64.
- Log-squared and minimum widths cover11<=x<=exp42.
- Historical gap computations remain explicit B-tier inputs; terminal primality is
  kernel proved.
- No RH, new source-first PV, optimality or best-known claim; existing versions remain
  unchanged.
