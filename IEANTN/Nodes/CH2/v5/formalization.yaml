version: v0.4
project:
  authors:
  - OpenAI (Codex)
  license: Apache-2.0
  responsible_maintainers:
  - hschae
  name: 'CH2: a fixed-zero-strip PNT transfer'
  description: A conservative fixed-strip consequence of the CH2 finite spectral formula. For 1/2<=beta<1,
    a zero-free half-plane Re(s)>beta gives Epsi(x)<=2(1-beta)^2 log(x)^2 x^(beta-1), above exp(16/(1-beta)).
    The coefficient and threshold are derived here rather than printed in CH2.
