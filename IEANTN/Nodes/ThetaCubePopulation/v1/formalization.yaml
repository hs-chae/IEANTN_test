limitations:
- Schoenfeld refined theta and finite Buthe two-sided signed source clauses remain
  explicit; the latter historical computation is not newly source-first verified.
- Compared with inherited0.7 coefficient under Octic, this uses a different assumption
  package. No hidden implication between the source packages or best-known literature
  claim.
- All cube prime windows are strictly open at both endpoints; the possible upper prime
  costs one count.
- Kernel-only D checking and literature-backed B inputs, no new source-first C/C++/CUDA
  PV.
