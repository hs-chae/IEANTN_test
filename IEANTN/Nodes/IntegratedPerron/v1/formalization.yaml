limitations:
- General published Perron formula and absolute convergence remain literature-backed, not Lean-proved.
  Its source-free Box adapter is proved separately.
- The x>1 restriction is a conservative subdomain of the published x>=1 formula. The source primitive
  uses integral0..x; a proved psi-vanishing lemma transfers to integral1..x.
