limitations:
- The local606-to610-billion edge needs the actual compensation profile and three original Buthe inputs;
  the global union retains the old nine inputs and adds genuine general Perron and Nicolas inputs, for11.
  These source packages are not a same-premise comparison.
- The entire nonconstant old640-billion polynomial and both tail maxima, plus the stronger619/620-billion
  margins, are preserved. No optimality, best-known or published-onset-record claim.
- Official Comparator verification remains pending on a compatible approved worker. Source-fresh kernel
  builds/axiom/body/dependency receipts are distinct; source inputs are explicit B-tier general published
  theorems.
- New interval numerical leaves are ordinary Lean kernel proofs, not source-first PV. Existing restricted
  C source/model/execution facts retain their documented renderer/model interpretation contract; independent
  parser soundness and the large finite prime-count source-first PV remain separate.
- Shared flat-source dependencies use the campaign reproducible source-rebuild route; the public Solution
  never imports an admitted Challenge.
