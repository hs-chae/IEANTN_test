limitations:
- Same nine original named source inputs as620b after taking the union through the paired-GM edge; not
  a same-six-premise record versus the640b route. The large finite prime-count source-first PV closure
  remains incomplete.
- Official Comparator receipt pending. These are source-compiled conditional Lean edges, not proofs of
  the external RH, explicit-formula, zero-estimate or exact Mellin premises.
- New shared flat-source dependencies are built by the campaign resource-aware reproduction route; standalone
  Comparator packaging and official dispatch remain separate.
- C source/model/execution theorems and exact rendered-source identity are reused under an explicit renderer/model
  interpretation contract. Independent source-parser soundness is not proved here; no new fully established
  source-first PV or whole-pipeline PV is claimed. New numerical certificates and analysis are kernel-only.
  Compiler/runtime/OS/ABI/hardware contracts remain.
