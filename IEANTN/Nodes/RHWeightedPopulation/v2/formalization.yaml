- Complete local pinned-Lean proofs and independently checked canonical interfaces are available. Standalone
  normal-Lake and official Comparator workflow validation/execution remain pending; no official receipt
  is claimed.
- Original mathematical inputs, algorithms, parameters and experimental outcomes are preserved. RH and
  the declared literature/finite inputs remain explicit. No best-known or optimality claim is made.
