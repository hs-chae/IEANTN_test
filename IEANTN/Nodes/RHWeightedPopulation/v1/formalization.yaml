limitations:
- Every new population/count conclusion is eventual, with a positive GoodCoefficient
  margin; no explicit onset or uniform threshold in alpha is claimed.
- PrimeInterval.v4.optimized_strict_family has onsetexp24, strict endpoints and1.03<=c<=16.
  Only its exact asymptotic leading width (9/8)*(alpha+18203/20000) is compared; those
  stronger finite-domain features are preserved in the old node.
- 'The minimum improves that octic leading line for all nonnegative alpha, but is
  not a global optimum: the separate new Gaussian gap coefficient is smaller at alpha0.'
- The analytic BR norm identity and q=1 uniform population proposition remain declared
  literature inputs, with ordinary RH supplied separately.
- No overall PV causal discovery advantage, official Comparator approval, or new unrestricted
  RH-only analytic theorem is claimed.
