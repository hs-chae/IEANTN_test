limitations:
- Local kernel source checking is separate from an official Comparator workflow receipt;
  no receipt or lean-comparator designation is fabricated.
- The mathematical input is exactly PrimeInterval.v4.optimized_strict_family. Its
  upstream RH plus Green/Nicolas/BPT source predicates remain explicit. No new source-first
  PV claim.
- Pinned Lake project packaging is supplied; source closure is compiled through the
  explicit replay procedure. An untested ordinary lake build is not asserted successful.
- No claim of optimality, best-known power intervals, or comparison with every stronger
  premise-union PNT route.
