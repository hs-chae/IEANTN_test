name = "agentB_pv_twobackend"
version = "0.1.0"
defaultTargets = ["TwoBackend", "ThreeChain"]

# Research composition (Agent B), NOT a node solution and not in the core build: Agent A's dyadic
# provider (Solutions/ScopedWinnerA.v1) composed with the shared-contract Ramanujan budget program
# (Solutions/ProgramVerification) through a kernel-checked data link.
[[require]]
name = "IEANTN"
path = "../.."

[[require]]
name = "solution_ProgramVerification"
path = "../../Solutions/ProgramVerification"

[[require]]
name = "solution_DudekPlattNumerics_v4"
path = "../../Solutions/DudekPlattNumerics.v4"

[[require]]
name = "scoped_winner_a_v1"
path = "../../Solutions/ScopedWinnerA.v1"

# Round 3 extension: the power-form transport (Table4Evolution.PowerAgentA) for the three-program chain.
[[require]]
name = "solution_Table4Evolution_v1"
path = "../../Solutions/Table4Evolution.v1"

# The selected C file is embedded by `include_str`; declaring it makes a changed file rebuild.
[[input_file]]
name = "selected_source"
path = "c/budget_301.c"
text = true

[[lean_lib]]
name = "TwoBackend"
needs = ["selected_source"]

# The three-program chain (round 3 extension): its own selected budget file and library, so a change
# to either C file rebuilds only its own chain (see Table4Evolution's lakefile for the measurement).
[[input_file]]
name = "budget_331_c"
path = "c/budget_331.c"
text = true

[[lean_lib]]
name = "ThreeChain"
needs = ["budget_331_c"]
